[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vtrux-bench"
version = "0.1.0"
description = "Shared bench toolkit for the Vtrux ESP32 firmware projects: the chain runner core."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vtrux-bench-run = "vtrux_bench.run.cli:main"

[tool.setuptools.packages.find]
include = ["vtrux_bench*"]
