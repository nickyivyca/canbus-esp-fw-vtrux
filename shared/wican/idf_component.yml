## vtrux/wican: the stock WiCAN code (SPEC.md W1). A project takes it from git
## at a pinned tag of shared/main, with its board and vtrux/debug_logs at the
## same tag. No version here: the tag is its version, and dependencies.lock
## records the commit the tag marks.
description: "The stock WiCAN firmware code, as one component"
dependencies:
  idf: ">=5.4"
  # wc_mdns.c, the mDNS advertisement. Upstream's manifest asks for "*"; the
  # version is the one its lock held, which gen-inhibit built with until the
  # move (W2), so a project that takes this component gets the same.
  espressif/mdns: "==1.4.0"
