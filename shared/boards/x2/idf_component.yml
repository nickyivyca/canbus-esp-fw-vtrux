## x2: Autosport Labs ESP32-CAN-X2 (shared/boards/SPEC.md section 3).
## A project takes it from git at a pinned tag of shared/main, as the
## dependency vtrux/x2 (README.md). No version here: the tag is its
## version, and dependencies.lock records the commit the tag marks.
description: "Board layer for the Autosport Labs ESP32-CAN-X2"
targets:
  - esp32s3
dependencies:
  idf: ">=5.4"
