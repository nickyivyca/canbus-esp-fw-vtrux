## vtrux/diag: the diag build-id read and the frame packer (SPEC.md D2, D3).
## A project takes it from git at a pinned tag of shared/main. No version
## here: the tag is its version, and dependencies.lock records the commit the
## tag marks.
description: "The diag build-id read and a frame packer driven by a table generated from the project's DBC"
targets:
  - esp32c3
  - esp32s3
dependencies:
  idf: ">=5.4"
