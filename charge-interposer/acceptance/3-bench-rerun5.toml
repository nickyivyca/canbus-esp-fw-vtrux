# Port step 3's bench baseline on madhouse-debian, fifth re-run (shared/bench
# ACCEPT-SPEC A2, A12a, A13; owned by the charge-interposer reviewer).
# Drafted by the tester for the reviewer's approval (the reviewer,
# 2026-11-20: "draft the list against b467's bench and 40e6's emulated and
# harness: same product, vp x3 plus the bench suite, declared_skips, 4
# slots in the settings, and the header naming every judgement and harness
# change since 40e6", with the results of a hand take of vport-bitrate and
