# ---- the baselines -----------------------------------------------------------
# The emulated and harness suites from 40e6, whose entry holds them as
# results (emulated 83 PASS, 2 KNOWN-FAIL, 3 NOT-RUN skips; harness 165 PASS,
# 9 NOT-RUN skips); the bench suite and vport-bitrate still from b467, the
# newest whole bench run (2b, harness and product f57ca9d3, on Windows),
# since no madhouse bench run has given a result.
[baseline]
emulated = "accept_3_20261118T143829_40e6/runs/accept_3_20261118T143829_40e6-emulated"
harness = "accept_3_20261118T143829_40e6/runs/accept_3_20261118T143829_40e6-harness"
bench = "accept_2b_20261109T072806_b467/runs/accept_2b_20261109T072806_b467-bench"
vp1 = "accept_2b_20261109T072806_b467/runs/accept_2b_20261109T072806_b467-vp1"

# The emulated suite against 40e6's: no difference. The same 40 checks (88
# results, host-bridge's per case: 83 PASS, 2 KNOWN-FAIL, 3 NOT-RUN) and
# Python reference; the two host_bridge KNOWN-FAILs are KNOWN-FAIL on both
# sides; any other FAIL, or a NOT-RUN that is not a declared skip, is a
# difference. The sims' read changes (drop_echoes, drain_ports, error frames
# skipped) and the 4 slots are expected to move no verdict. Tracker I's
# product change moves nothing here: no host build compiles
# boot_partitions.c (host_bridge's l2_build.sh compiles the port files and
# machine.cpp, host_diff compiles machine.cpp), main/CMakeLists.txt and
# sdkconfig are IDF build inputs only, and machine.py is unchanged. The
# product digest (bench_suite.product_files: main/, CMakeLists.txt,
# sdkconfig, dependencies.lock) differs from 40e6's, which is identity, not
# a judged line.
[[compare]]
id = "c-emulated"
comparer = "run-records"
a = "baseline:emulated"
b = "emulated"
expect = "listed"
differences = []

# The harness suite against 40e6's (165 PASS, 9 declared skips: 174 ids):
# 188 ids at this tree, 16 new, each expected to pass, and 2 gone; every
# other id keeping its verdict is expected. Tracker I's product change
# moves nothing here, as for c-emulated: no harness check builds or reads
# boot_partitions.c, CMakeLists.txt or sdkconfig (its coredump_config_check
# is run after the IDF builds, in no suite; vtrux_checks.json's two new
# core-dump settings are checked by the builds). The bench_vport changes on
# this list's topic change tests under the unchanged ids
# l-harness/st.bench-vport and cf.bench-vport (the self-test 269 checks,
# the can-fail 141 mutants).
[[compare]]
id = "c-harness"
comparer = "run-records"
a = "baseline:harness"
b = "harness"
expect = "listed"
differences = [
  "MISSING in b: m-harness/adapter-fixes-test (was PASS)",
  "MISSING in b: m-harness/adapter-fixes-test-canfail (was PASS)",
  "NEW in b: m-harness/adapter-roles-test PASS",
  "NEW in b: m-harness/adapter-roles-test-canfail PASS",
  "NEW in b: l-harness/st.bench-boot-reset PASS",
  "NEW in b: l-harness/st.bench-boot-reset-fixture PASS",
  "NEW in b: l-harness/st.bench-coredump-readback PASS",
  "NEW in b: l-harness/st.reset-check PASS",
  "NEW in b: l-harness/st.bench-layer-check PASS",
  "NEW in b: l-harness/st.reader-death PASS",
  "NEW in b: l-harness/st.bench-rate-feasibility PASS",
  "NEW in b: l-harness/cf.bench-boot-reset PASS",
  "NEW in b: l-harness/cf.bench-boot-reset-fixture PASS",
  "NEW in b: l-harness/cf.bench-coredump-readback PASS",
  "NEW in b: l-harness/cf.reset-check PASS",
  "NEW in b: l-harness/cf.bench-layer-check PASS",
  "NEW in b: l-harness/cf.reader-death PASS",
  "NEW in b: l-harness/cf.bench-rate-feasibility PASS",
]

# The bench suite against b467's: 86 checks, 17 declared skips; b467 had 83
# (64 PASS, the 17 skips NOT-RUN, b-witness/switch-loss KNOWN-FAIL (spec
# 12's 2.3 entry), and b-vport/vport-listen-wrong-rate VOID (TEST FAULT;
# variance from the known defect, not listed; the hand take E4 above shows
# it VOID again on the node's failed sends, b467's TEST FAULTs, and no
# longer on the witness)). The three boot-reset-0x15 checks
# are new, each expected to pass on this product. Some checks judge
# differently since b467, so the same verdict is expected on a changed
# judgement: the reviewer's D1-D6 (3-bench-rerun.toml's header), the Linux
# judging of the no-ACKer boots and close-boots' hard reset
# (3-bench-rerun4.toml's header), and the judgement changes since 40e6
# above. A verdict that moves is a difference to judge line by line in the
# tester's entry, the judgement change and Linux-side causes included. A
# VOID "kvaser TX stall" or "kvaser link" is a difference too, with the
# kernel lines its detail carries.
[[compare]]
id = "c-bench"
comparer = "run-records"
a = "baseline:bench"
b = "bench"
expect = "listed"
differences = [
  "NEW in b: b-bridge/boot-reset-0x15 PASS",
  "NEW in b: b-witness/boot-reset-0x15 PASS",
  "NEW in b: b-truck/boot-reset-0x15 PASS",
]

# The three vport runs, each against the first and against b467's vp1: the
# same verdicts, no TEST FAULT, no figure tolerance (vport-bitrate's node
# frames count as sent on their own echo, D3). The hand take E5 on this
# tree gave b467's verdicts; the differences E1 and E3 still showed (a 250k
# flooding window VOID on a PCAN controller overrun, a 1M flooding window
# with a witness gone quiet) are listed one by one with their causes in the
# header, "DIFFERENCES LEFT".
[[compare]]
id = "vp1-vp2"
comparer = "vport-windows"
