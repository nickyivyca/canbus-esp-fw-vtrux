b = "vp3"
expect = "same-verdicts"

[[compare]]
id = "vp1-b467"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp1"
expect = "same-verdicts"

[[compare]]
id = "vp2-b467"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp2"
expect = "same-verdicts"

[[compare]]
id = "vp3-b467"
