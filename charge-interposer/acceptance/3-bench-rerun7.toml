# ---- the baselines -----------------------------------------------------------
# All from e599 (the reviewer, 2026-11-23: "every baseline from e599, vp1
# included: accepted"), the first madhouse run whose bench phase gave
# results, in place of b467's bench and vp1: its
# emulated suite (83 PASS, 2 KNOWN-FAIL, 3 NOT-RUN skips), harness suite
# (181 PASS, 9 NOT-RUN skips), bench suite (65 PASS, 2 FAIL, 1 KNOWN-FAIL,
# 1 VOID, 17 NOT-RUN skips) and vp1 (PASS, held against b467), all on the
# same product files as this list.
[baseline]
emulated = "accept_3_20261121T191433_e599/runs/accept_3_20261121T191433_e599-emulated"
harness = "accept_3_20261121T191433_e599/runs/accept_3_20261121T191433_e599-harness"
bench = "accept_3_20261121T191433_e599/runs/accept_3_20261121T191433_e599-bench"
vp1 = "accept_3_20261121T191433_e599/runs/accept_3_20261121T191433_e599-vp1"

# The emulated suite against e599's: no difference. The same 40 checks (88
# results: 83 PASS, 2 KNOWN-FAIL, 3 NOT-RUN) and Python reference; the two
# host_bridge KNOWN-FAILs are KNOWN-FAIL on both sides; any other FAIL, or a
# NOT-RUN that is not a declared skip, is a difference. The product files
# are e599's (digest fee522d4ea6f); the harness changes above are expected
# to move no verdict here.
[[compare]]
id = "c-emulated"
comparer = "run-records"
a = "baseline:emulated"
b = "emulated"
expect = "listed"
differences = []

# The harness suite against e599's (181 PASS, 9 declared skips: 190 ids):
# 194 ids at this tree, 6 new, each expected to pass, and 2 gone; every
# other id keeping its verdict is expected. The 8.2 fix adds
# diag-cadence-test-canfail; B retires bench_rate_feasibility's self-test
# and can-fail and adds bench_offer's and bench_charger_witness's, and
# innomaker_clock's can-fail. The other changes since 9cdffa19 change tests
# under their unchanged ids. The gate runs harness_332f8d5a and
# harness_vport_B5 gave these lines against e599's record.
[[compare]]
id = "c-harness"
comparer = "run-records"
a = "baseline:harness"
b = "harness"
expect = "listed"
differences = [
  "MISSING in b: l-harness/cf.bench-rate-feasibility (was PASS)",
  "MISSING in b: l-harness/st.bench-rate-feasibility (was PASS)",
  "NEW in b: l-harness/cf.bench-charger-witness PASS",
  "NEW in b: l-harness/cf.bench-innomaker-clock PASS",
  "NEW in b: l-harness/cf.bench-offer PASS",
  "NEW in b: l-harness/st.bench-charger-witness PASS",
  "NEW in b: l-harness/st.bench-offer PASS",
  "NEW in b: m-harness/diag-cadence-test-canfail PASS",
]

# The bench suite against e599's: the same 86 checks and 17 declared skips.
# Every check is changed since e599 (B reaches every bench check's code), so
# the same verdict is expected on a changed judgement, with these listed:
# board.restart-after-standby and board.hvil-before-flow-drop, e599's two
# 8.2 FAILs, are expected to PASS on the 8.2 fix (both PASS in its gate).
# b-witness/switch-loss stays KNOWN-FAIL (spec 12's 2.3 entry) and
# vport-listen-wrong-rate VOID (TEST FAULT, as e599 and b467). A verdict
# that moves otherwise is a difference to judge line by line in the
# tester's entry, the judgement changes above and Linux-side causes
# included. A VOID "kvaser TX stall" or "kvaser link" is a difference too,
# with the kernel lines its detail carries.
[[compare]]
id = "c-bench"
comparer = "run-records"
a = "baseline:bench"
b = "bench"
expect = "listed"
differences = [
  "VERDICT b-bridge/board.hvil-before-flow-drop: FAIL -> PASS",
  "VERDICT b-bridge/board.restart-after-standby: FAIL -> PASS",
]

# The three vport runs, each against the first and against e599's vp1 (PASS,
# held against b467): the same verdicts, no TEST FAULT, no figure tolerance
# (vport-bitrate's node frames count as sent on their own echo, D3). A 1M
# flooding window with the witness gone quiet (the open observation above)
# and 3-bench-rerun5.toml's DIFFERENCES LEFT items are judged one by one
# with their causes.
[[compare]]
id = "vp1-vp2"
comparer = "vport-windows"
a = "vp1"
b = "vp2"
expect = "same-verdicts"

[[compare]]
id = "vp1-vp3"
comparer = "vport-windows"
a = "vp1"
b = "vp3"
expect = "same-verdicts"

[[compare]]
id = "vp1-e599"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp1"
expect = "same-verdicts"

[[compare]]
id = "vp2-e599"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp2"
expect = "same-verdicts"

[[compare]]
id = "vp3-e599"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp3"
expect = "same-verdicts"

# ---- spec 8.3: no ESP-IDF line before setup() -----------------------------
# In the bench suite run, as in 2b and 3-bench.toml: the truck by
# b-truck/flight-silence; bridge and witness by b-bridge/idf-log and
# b-witness/idf-log.
