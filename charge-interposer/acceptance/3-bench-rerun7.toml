# Port step 3's bench baseline on madhouse-debian, seventh re-run (shared/bench
# ACCEPT-SPEC A2, A12a, A13; owned by the charge-interposer reviewer).
# Drafted by the tester for the reviewer's approval: after run e599 the
# reviewer's plan (2026-11-23) was the 8.2 fix first, on its own range, then
# A (the sweep rulings) and B (can-tools f19d04b5: reader_guard, echo_watch,
# replay.pace), each with its own gate, then "draft rerun7 naming e599". On
# B's bench scope: "rerun7's whole bench phase covers the rest"; every bench
# check is changed in this list (B's import closure reaches all 69 runnable
# bench checks: kvaser_link under vehicle_sim and run_scenario, diag_cadence
# under every board.* check, reader_guard under the readers), so nothing
# stands on e599's bench phase. The vp runs, the two board checks and the
# emulated suite whole stay as ruled. The 1M-flood witness stays an open
# observation (quiet in 5 of 9 runs at e599; 6 of 10 with B's gate run).
# A re-run of 3-bench-rerun6.toml, on the same product: everything its
# header and those it cites say (the hand takes, DIFFERENCES LEFT, the
# judgement changes since b467, the settings, the declared skips, placement
# and the lock) stands, and this header names only what changed since.
#
# Run e599 (runs/accept_3_20261121T191433_e599, from 3-bench-rerun6.toml at
# 180a3e22, harness 9cdffa19, product 5dc29741's with tracker I, digest
# fee522d4ea6f, shared/bench 2026.11.20) started 2026-11-21 19:14:33 and
# closed ACCEPTANCE FAIL on 2026-11-23 at 01:17. Its builds, emulated suite
# (c-emulated held), harness suite (181 PASS, c-harness held), vp1 and vp2
# (PASS, held against b467) are results, and so is its bench phase but for
# two checks (the tester's VERIFICATION.md entry, accepted by the reviewer
# 2026-11-23): bench 65 PASS (mcp-reset's first real result among them),
# switch-loss KNOWN-FAIL (spec 12's 2.3 entry), vport-listen-wrong-rate VOID
# as b467; board.restart-after-standby and board.hvil-before-flow-drop FAILed
# on spec 8.2 only, a harness defect (diag_cadence compared the previous
# boot's flushed event line with the new boot's first); vp3 VOID on the 1M
# flooding window, the witness quiet (the open observation's fifth). This
# list's record names e599 (A13: the runner's --earlier
# accept_3_20261121T191433_e599).
#
# HARNESS CHANGES since e599's harness 9cdffa19, all merged into
# charge-interposer/main:
#   - 5231f25a (merged 77476f5d), the 8.2 fix: diag_cadence.state_changes
#     starts afresh at a new boot (a boot line or an uptime drop), so a
#     previous boot's last event line is never compared with the new boot's;
#     diag_cadence_test's new-boot cases and its can-fail (new id
#     m-harness/diag-cadence-test-canfail). A JUDGEMENT CHANGE for every
#     board.* check's 8.2 line: e599's two FAILs are expected to PASS.
#   - c12dce6f (merged eda2d9cc), sweep rulings A1-A5, each a JUDGEMENT
#     CHANGE: usb-host's RESULT line names its VOID boot count;
#     bridge-cycles VOID unless every stop is judged (0 judged is VOID);
#     vport-recstart's SOMETHING ELSE / NEITHER a VOID with its text;
#     vport-stall's verdicts say why the no-ACKer variant is not run;
#     topology's unplaced bench-role adapter a VOID (UNRESOLVED stays a
#     FAIL); premise VOID lines at these drivers and bench_suite.script_judge
#     (a traceback read as FAIL before).
#   - B, merged 223e334e (c12dce6f..1c9f6ccd): can-tools pin 49eb7777 ->
#     f19d04b5; every bench reader on canbench's reader_guard.read_loop with
#     drain=False; kvaser_link's EchoWatch / WatchedBus over canbench's
#     echo_watch, Stall and its "kvaser TX stall: " line kept (run_scenario's
#     KVASER_VOID still matches); charger-silent and topology send without
#     reading (read_after_send=False), their reader threads judge the 100 ms
#     bound; bench_offer (new) over replay.pace, cut by a stop Event at
#     t0+seconds; bench_rate_feasibility.py and bench_pacer.py retired;
#     premise VOID lines at powerup_round, keepalive_probe, reset_check,
#     charger_silent, hold12, switch_loss, switch_errors, switch_pending,
#     innomaker_clock, charger_witness. The reviewer accepted these
#     judgement moves (2026-11-23): DiagWitness's own row-handling error is
#     recorded (NOT EXERCISED); single-reader sends do canbench's
#     non-blocking read after each send (usb-host's injector stamp includes
#     it); EchoWatch.finish() while suspended raises EchoWatchError;
#     bench_offer's catchup is pace's count, in passes.
#   - C: no VERIFICATION.md entry cites a bench_pacer catchup figure, so
#     nothing was corrected.
#   - Pins: can-tools f19d04b5 (moved); shared/bench 2026.11.20, shared/tools
#     and twai_port as e599. A17 reuse of e599's emulated suite cannot apply:
#     the can-tools pin's pins.json is in the emulated harness digest, so the
#     emulated suite runs whole again.
#
# THE GATES. Records in reverse-it
# projects/vtrux/notes/artifacts/interposer-firmware/runs/:
#   - 8.2 fix, on 5231f25a: harness_5231f25a, the whole harness suite, 182
#     PASS with the 9 declared skips; ht_gate_5231f25a, both board checks
#     end to end, PASS 2, each 8.2 line PASS.
#   - A, on c12dce6f: harness3_c12dce6f, 182 PASS with the 9 declared skips;
#     ht_gate2_c12dce6f PASS 10 (usb-host x7, topology, vport-stall,
#     vport-recstart).
#   - B, on 332f8d5a and 1c9f6ccd: harness_332f8d5a, PASS 184, FAIL 1
#     (cf.bench-vport 163 of 165: two mutants whose read is can-tools' code
#     since B2, retired by 1c9f6ccd), the 9 declared skips; harness_vport_B5
#     (1c9f6ccd) st/cf.bench-vport PASS 2 (163 of 163 caught);
#     ht_gate_332f8d5a, the 30 and board.normal-full: PASS 27, switch-loss KNOWN-FAIL,
#     vport-listen-wrong-rate VOID (as e599), vport-bitrate VOID on its 1M
#     flooding window (the open observation below), the declared skip
#     innomaker-rate-runs-reopen NOT-RUN.
#
# OPEN OBSERVATION, the 1M flooding witness (the reviewer, 2026-11-21 and
# 2026-11-23): in vport-bitrate's 1M flooding window the PCAN witness went
# quiet within the window's first 0.05 s in 6 of the 10 Linux runs with that
# window (C4, D3, E1, E3, e599's vp3 at 0.015-0.043 s, B's gate run
# ht_gate_332f8d5a at 0.003-0.005 s with a clean resource record; E5, F1,
# e599's vp1 and vp2 heard it). Its cause is not shown. A quiet window is
# REFUSED, not covered (8b609320), so vp1-vp3 may each read VOID there against e599's
# vp1 PASS, judged line by line at the close. 3-bench-rerun5.toml's
# DIFFERENCES LEFT items 1 and 3 stand as written.
#
# Trees:
#   harness   1151afc1, charge-interposer/main: the file map's
#             bench_drivers/ row on the merge 223e334e of sweep-pin's B
#             range, on eda2d9cc (A's merge), on 77476f5d (the 8.2 fix's).
#             Its tree differs from B5's 1c9f6ccd in
#             charge-interposer/README.md only. Its can-tools pin f19d04b5.
#             This list's own commit follows on
#             charge-interposer/tester/rerun7, from it.
#   prod      the same commit, whose product files are 5dc29741's (as 69d8
#             and e599; no product file changed since 180a3e22): the three
#             bench builds come from it.

[step]
id = "3"
project = "charge-interposer"
ordered_by = "charge-interposer reviewer"
ordered_on = "2026-11-23"
spec = ["2", "2.1", "2.2", "2.3", "2.4", "8", "8.2", "8.3", "9", "9.1", "10", "12"]
verification = "the tester's VERIFICATION.md entries for port step 3's bench baseline"

[trees.harness]
project = "1151afc12eb29ee9a772ab76675f5e91a78c7f08"

# ---- the three variants the bench suite flashes ----------------------------
[[build]]
id = "bridge"
tree = "harness"
target = "idf-build"
options = { variant = "bridge" }

[[build]]
id = "witness"
tree = "harness"
target = "idf-build"
options = { variant = "witness" }

[[build]]
id = "truck"
tree = "harness"
target = "idf-build"
options = { variant = "truck" }

# ---- the emulated suite, whole (the bench suite's requires) ---------------
# Whole again: the bench suite requires a whole emulated run on the same
# code in the same record (Suite.requires, requires_whole); A17 reuse of
# e599's cannot apply, since the can-tools pin moved and with it the
# harness digest.
[[suite_run]]
id = "emulated"
tree = "harness"
suite = "emulated"
declared_skips = [
  { id = "m-build/build-check", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-build/manifest-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-build/manifest-offline-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
]

# ---- the harness suite, whole ----------------------------------------------
[[suite_run]]
id = "harness"
tree = "harness"
suite = "harness"
after = ["emulated"]
declared_skips = [
  { id = "m-harness/build-check-links-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-manifest-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-schema-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-schema-test-canfail", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-in-clone-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-in-clone-test-canfail", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/digest-recheck-check", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/digest-recheck-check-canfail", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "l-harness/cutover-verify-test", reason = "historical: the one-time 2026-10-08 cutover, verified then (reviewer 2026-10-18); cutover_verify_test.py and its --guard-test retired, nothing left to guard (reviewer 2026-10-31)" },
