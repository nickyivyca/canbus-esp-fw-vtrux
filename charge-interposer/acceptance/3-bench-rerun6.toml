# Port step 3's bench baseline on madhouse-debian, sixth re-run (shared/bench
# ACCEPT-SPEC A2, A12a, A13; owned by the charge-interposer reviewer).
# Drafted by the tester for the reviewer's approval: after run 69d8 the
# reviewer's plan (2026-11-21) was (i) fix the three harness defects, each
# with a test and a can-fail, (ii) cf.bench-vport's timeout 7200 s, (iii)
# the whole harness suite and a bench hand run of every changed check on
# the commit sent, (iv) one hand take on the fix commit, "(v) then rerun6
# naming 69d8"; and, on the hand take's findings, "fix them now, on this
# topic, all four", with a sweep of every bench driver script_judge reads,
# then "the gate ... Then the range, then rerun6 naming 69d8. The 1M-flood
# witness stays an open observation (quiet in 4 of 6 runs) in rerun6's
# header." On the range's merge: "Rerun6 next, on main as it now stands."
# A re-run of 3-bench-rerun5.toml, on the same product: everything
# its header says (the hand takes E1-E5, DIFFERENCES LEFT, the judgement
# and harness changes since 40e6's harness 8025a7c3, the product change
# since 40e6 and b467, the settings, the declared skips, placement and the
# lock) stands, and this header names only what changed since.
#
# Run 69d8 (runs/accept_3_20261121T014726_69d8, from 3-bench-rerun5.toml at
# c5e29485, harness 8b609320, product 5dc29741's with tracker I, digest
# fee522d4ea6f, shared/bench 2026.11.20) started 2026-11-21 01:47:26 and
# closed ACCEPTANCE FAIL at 12:27:43. Its builds and emulated suite are
# results (c-emulated held against 40e6); its harness suite and its whole
# bench phase are not (the tester's VERIFICATION.md entry, accepted by the
# reviewer 2026-11-21): bench_vport's PCAN changes failed can-tools-pin-test
# and adapter-roles-test (each with its can-fail); cf.bench-vport ran past
# 3600 s; vp1-vp3 and vport-bitrate stopped on a NameError after the 250k
# idle window; the 29 board.* ERRORed on run_scenario's start-reset change;
# reset-check FAILed on a board mcp-reset had left in the serial loader;
# mcp-reset's PASS was not a result (it could not fail); vport-flood and
# vport-stall VOID on Kvaser TX stalls. This list's record names 69d8 (A13:
# the runner's --earlier accept_3_20261121T014726_69d8).
#
# HARNESS CHANGES since 69d8's harness 8b609320, on
# charge-interposer/tester/rerun5-fixes (from main ffe4c997), merged into
# charge-interposer/main as 62d714a4:
#   - 1ce954e9: run_scenario's start-reset flag renamed (booted), so run_one's
#     started() helper is no longer hidden (the 29 board.* ERRORs);
#     bench_vport's step 2 window judgement out of run_bench into
#     judge_bitrate_window / bitrate_stamps (the NameError); bench_vport's
#     self-test takes canbench through can_tools_pin.use, and
#     adapter_roles_test allows its second PcanBus (can-tools-pin-test,
#     adapter-roles-test); harness_names.py, a check of every harness file
#     for undefined and rebound names, with harness_names_test.py (new ids
#     m-harness/harness-names-test and its can-fail); cf.bench-vport's
#     timeout 7200 s (149 mutants x ~25 s ~= 3700 s; every other can-fail
#     3600 s). Judges nothing new.
#   - 432ea45e, checks that could not fail (the reviewer, 2026-11-21), each
#     a JUDGEMENT CHANGE: bench_mcp_reset's run exits 3 with a VOID line per
#     faulted boot (it exited 0 on every outcome), takes the loaded bridge
#     image's build id (--build, identify's; it was fixed at 0x756D6714),
#     and releases each ROM hold with esptool --before default_reset
#     --after hard_reset (no_reset + hard_reset left the X2 in the serial
#     loader on madhouse; why is not shown); charger-silent: reader errors
#     on the vehicle side are a VOID (a FAIL kept); topology: an adapter
#     that did not open is a VOID line, RESOLVED exits 3; c9-noack: C9
#     skipped on CANWITHHOLD @NO is a VOID; rx-order: a failed variant
#     prints a FAIL line, a short offer a VOID line. paths_test's scans
#     leave out what git ignores (judges nothing new on a clean tree).
#   - 0f867aa9: bench_suite_test's can-fail restores every mutated
#     attribute (test_mutants_restorable). Judges nothing new.
#   - Pins unchanged: can-tools 49eb7777, shared/bench 2026.11.20,
#     shared/tools and twai_port as 69d8. A17 reuse of 69d8's emulated suite
#     cannot apply: run_scenario changed, so the harness digest differs and
#     the emulated suite runs whole again.
#
# THE GATE on 0f867aa9 (the reviewer's rule from 2026-11-21: the whole
# harness suite and a bench hand run of every changed check on the commit
# sent). Records in reverse-it
# projects/vtrux/notes/artifacts/interposer-firmware/runs/:
#   - harness_0f867aa9, the whole harness suite, 2026-11-21 16:44:58-
#     19:09:15: 181 PASS and the 9 declared skips NOT-RUN, nothing else.
#   - ht_gate_0f867aa9, 2026-11-21 16:45-16:56, with the bench suite's
#     images built from 1ce954e9 (no product file changed after it), the
#     X2 read back on bridge c4a553bb: PASS 7. charger-silent; rx-order (every burst
#     complete and in order); mcp-reset "ACKED WITH THE ESP DOWN 8" (5
#     resets and 3 holds, 0x7F7 build 0xC4A553BB, the loaded bridge's, and
#     every hold came back); mcp-reset-canfail CANFAIL-OK; reset-check
#     right after them "RESET PROVEN: YES (uptime 2 -> 0)"; topology
#     RESOLVED, no adapter failed to open; c9-noack ran C9.
#   - Before it, on 1ce954e9: ht_board_1ce954e9 (b-bridge/
#     board.charger-fault-stop end to end) PASS; and the hand takes F1-F3
#     on vport_bench 6955b830 (runs/vport_stall_20261120/F1-F3, bench_vport
#     unchanged since): F1 vport-bitrate exit 0, all four windows judged,
#     no VOID, b467's vp1 verdicts; F2 vport-flood both PASS; F3
#     vport-stall (acked) PASS, no Kvaser stall.
#
# OPEN OBSERVATION, the 1M flooding witness (the reviewer, 2026-11-21): in
# vport-bitrate's 1M flooding window the PCAN witness went quiet within the
# window's first 0.05 s in 4 of the 6 Linux runs with that window (C4, D3,
# E1, E3 quiet; E5 and F1 heard the whole window, F1 547025 error frames,
# stamps 0.000-60.306 s, largest gap 0.038 s). Its cause is not shown. A
# quiet window is REFUSED, not covered (8b609320), so vp1-vp3 may each read
# VOID there against b467's PASS: 3-bench-rerun5.toml's DIFFERENCES LEFT
# item 2, judged line by line at the close. Its items 1 (a 250k flooding
# window VOID on a PCAN controller overrun) and 3 (vport-listen-wrong-rate
# VOID on the node's failed sends, as b467's) stand as written.
#
# Trees:
#   harness   9cdffa19, charge-interposer/main: the merge 62d714a4 of
#             rerun5-fixes (main ffe4c997, 69d8's c5e29485 with the
#             methodology's AGENTS.md pick, with 1ce954e9, 432ea45e and
#             0f867aa9) and the file map's harness_names rows (9cdffa19).
#             Its tree differs from the gate's 0f867aa9 in
#             charge-interposer/README.md only. Its can-tools pin 49eb7777.
#             This list's own commit follows on
#             charge-interposer/tester/rerun6, from it.
#   prod      the same commit, whose product files are 5dc29741's (as 69d8):
#             the three bench builds come from it.

[step]
id = "3"
project = "charge-interposer"
ordered_by = "charge-interposer reviewer"
ordered_on = "2026-11-21"
spec = ["2", "2.1", "2.2", "2.3", "2.4", "8", "8.2", "8.3", "9", "9.1", "10", "12"]
verification = "the tester's VERIFICATION.md entries for port step 3's bench baseline"

[trees.harness]
project = "9cdffa195357ba6283c21a0eeebf59e6e45788d8"

# ---- the three variants the bench suite flashes ----------------------------
[[build]]
id = "bridge"
tree = "harness"
target = "idf-build"
options = { variant = "bridge" }

[[build]]
id = "witness"
tree = "harness"
target = "idf-build"
options = { variant = "witness" }

[[build]]
id = "truck"
tree = "harness"
target = "idf-build"
options = { variant = "truck" }

# ---- the emulated suite, whole (the bench suite's requires) ---------------
# Whole again: the bench suite requires a whole emulated run on the same
# code in the same record (Suite.requires, requires_whole); A17 reuse of
# 69d8's cannot apply, since run_scenario changed and with it the harness
# digest.
[[suite_run]]
id = "emulated"
tree = "harness"
suite = "emulated"
declared_skips = [
  { id = "m-build/build-check", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-build/manifest-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-build/manifest-offline-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
]

# ---- the harness suite, whole ----------------------------------------------
[[suite_run]]
id = "harness"
tree = "harness"
suite = "harness"
after = ["emulated"]
declared_skips = [
  { id = "m-harness/build-check-links-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-manifest-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-schema-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-schema-test-canfail", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-in-clone-test", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/build-check-in-clone-test-canfail", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/digest-recheck-check", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "m-harness/digest-recheck-check-canfail", reason = "retired at port step 2a: the PlatformIO build, its manifest and the build_check / digest_recheck_check family went with Part B (reviewer 2026-11-03, Q3); the IDF builds are 2a acceptance (h)" },
  { id = "l-harness/cutover-verify-test", reason = "historical: the one-time 2026-10-08 cutover, verified then (reviewer 2026-10-18); cutover_verify_test.py and its --guard-test retired, nothing left to guard (reviewer 2026-10-31)" },
