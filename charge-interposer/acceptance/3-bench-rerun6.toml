# ---- the baselines -----------------------------------------------------------
# The emulated suite from 69d8, whose entry holds its builds and emulated
# suite as results (83 PASS, 2 KNOWN-FAIL, 3 NOT-RUN skips; c-emulated held
# against 40e6), on the same product files as this list; the harness suite
# still from 40e6 (165 PASS, 9 NOT-RUN skips), since 69d8's is not a
# result; the bench suite and vport-bitrate still from b467, the newest
# whole bench run (2b, harness and product f57ca9d3, on Windows), since no
# madhouse bench run has given a result.
[baseline]
emulated = "accept_3_20261121T014726_69d8/runs/accept_3_20261121T014726_69d8-emulated"
harness = "accept_3_20261118T143829_40e6/runs/accept_3_20261118T143829_40e6-harness"
bench = "accept_2b_20261109T072806_b467/runs/accept_2b_20261109T072806_b467-bench"
vp1 = "accept_2b_20261109T072806_b467/runs/accept_2b_20261109T072806_b467-vp1"

# The emulated suite against 69d8's: no difference. The same 40 checks (88
# results, host-bridge's per case: 83 PASS, 2 KNOWN-FAIL, 3 NOT-RUN) and
# Python reference; the two host_bridge KNOWN-FAILs are KNOWN-FAIL on both
# sides; any other FAIL, or a NOT-RUN that is not a declared skip, is a
# difference. The product files are 69d8's (digest fee522d4ea6f), and
# 1ce954e9's run_scenario change (the start-reset flag's name, so run_one's
# started() helper is no longer hidden) is expected to move no verdict
# here.
[[compare]]
id = "c-emulated"
comparer = "run-records"
a = "baseline:emulated"
b = "emulated"
expect = "listed"
differences = []

# The harness suite against 40e6's (165 PASS, 9 declared skips: 174 ids):
# 190 ids at this tree, 18 new, each expected to pass, and 2 gone; every
# other id keeping its verdict is expected. The gate's run
# harness_0f867aa9 gave exactly these lines against 40e6's record. Against
# 3-bench-rerun5.toml's list the two new lines are 1ce954e9's
# harness-names-test and its can-fail. Tracker I's product change moves
# nothing here: no harness check builds or reads boot_partitions.c,
# CMakeLists.txt or sdkconfig (its coredump_config_check is run after the
# IDF builds, in no suite; vtrux_checks.json's two new core-dump settings
# are checked by the builds). The bench_vport changes since 5dc29741
# change tests under the unchanged ids l-harness/st.bench-vport and
# cf.bench-vport, and the changes of 1ce954e9, 432ea45e and 0f867aa9 to
# bench_suite_test and the swept drivers' self-tests change tests under
# their unchanged ids.
[[compare]]
id = "c-harness"
comparer = "run-records"
a = "baseline:harness"
b = "harness"
expect = "listed"
differences = [
  "MISSING in b: m-harness/adapter-fixes-test (was PASS)",
  "MISSING in b: m-harness/adapter-fixes-test-canfail (was PASS)",
  "NEW in b: m-harness/adapter-roles-test PASS",
  "NEW in b: m-harness/adapter-roles-test-canfail PASS",
  "NEW in b: m-harness/harness-names-test PASS",
  "NEW in b: m-harness/harness-names-test-canfail PASS",
  "NEW in b: l-harness/st.bench-boot-reset PASS",
  "NEW in b: l-harness/st.bench-boot-reset-fixture PASS",
  "NEW in b: l-harness/st.bench-coredump-readback PASS",
  "NEW in b: l-harness/st.reset-check PASS",
  "NEW in b: l-harness/st.bench-layer-check PASS",
  "NEW in b: l-harness/st.reader-death PASS",
  "NEW in b: l-harness/st.bench-rate-feasibility PASS",
  "NEW in b: l-harness/cf.bench-boot-reset PASS",
  "NEW in b: l-harness/cf.bench-boot-reset-fixture PASS",
  "NEW in b: l-harness/cf.bench-coredump-readback PASS",
  "NEW in b: l-harness/cf.reset-check PASS",
  "NEW in b: l-harness/cf.bench-layer-check PASS",
  "NEW in b: l-harness/cf.reader-death PASS",
  "NEW in b: l-harness/cf.bench-rate-feasibility PASS",
]

# The bench suite against b467's: 86 checks, 17 declared skips; b467 had 83
# (64 PASS, the 17 skips NOT-RUN, b-witness/switch-loss KNOWN-FAIL (spec
# 12's 2.3 entry), and b-vport/vport-listen-wrong-rate VOID (TEST FAULT;
# variance from the known defect, not listed; 3-bench-rerun5.toml's hand
# take E4 shows it VOID again on the node's failed sends, b467's TEST
# FAULTs, and no longer on the witness)). Of b467's 64 PASS, mcp-reset's
# was not a result (it could not fail; VERIFICATION.md's correction of
# 2026-11-21); from 432ea45e it can, and is expected to pass, as in the
# gate's hand run. The three boot-reset-0x15 checks are new, each expected
# to pass on this product. Some checks judge differently since b467, so
# the same verdict is expected on a changed judgement: the reviewer's
# D1-D6 (3-bench-rerun.toml's header), the Linux judging of the no-ACKer
# boots and close-boots' hard reset (3-bench-rerun4.toml's header), the
# judgement changes since 40e6 (3-bench-rerun5.toml's header), and
# 432ea45e's above (mcp-reset, charger-silent, topology, c9-noack and
# rx-order each VOID or FAIL where they read PASS before). A verdict that
# moves is a difference to judge line by line in the tester's entry, the
# judgement change and Linux-side causes included. A VOID "kvaser TX
# stall" or "kvaser link" is a difference too, with the kernel lines its
# detail carries.
[[compare]]
id = "c-bench"
comparer = "run-records"
a = "baseline:bench"
b = "bench"
expect = "listed"
differences = [
  "NEW in b: b-bridge/boot-reset-0x15 PASS",
  "NEW in b: b-witness/boot-reset-0x15 PASS",
  "NEW in b: b-truck/boot-reset-0x15 PASS",
]

# The three vport runs, each against the first and against b467's vp1: the
# same verdicts, no TEST FAULT, no figure tolerance (vport-bitrate's node
# frames count as sent on their own echo, D3). The hand takes E5
# (28ca5206) and F1 (1ce954e9, bench_vport unchanged since) gave b467's
# verdicts, and their 4 windows each and b467's 12 stay judged under
# 8b609320's coverage rule; the differences 3-bench-rerun5.toml's header
# lists in "DIFFERENCES LEFT" (a 250k flooding window VOID on a PCAN
# controller overrun, a 1M flooding window with a witness gone quiet,
# REFUSED from 8b609320, now the open observation above) are judged one by
# one with their causes.
[[compare]]
id = "vp1-vp2"
comparer = "vport-windows"
a = "vp1"
b = "vp2"
expect = "same-verdicts"

[[compare]]
id = "vp1-vp3"
comparer = "vport-windows"
a = "vp1"
b = "vp3"
expect = "same-verdicts"

[[compare]]
id = "vp1-b467"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp1"
expect = "same-verdicts"

[[compare]]
id = "vp2-b467"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp2"
expect = "same-verdicts"

[[compare]]
id = "vp3-b467"
comparer = "vport-windows"
a = "baseline:vp1"
b = "vp3"
expect = "same-verdicts"

# ---- spec 8.3: no ESP-IDF line before setup() -----------------------------
# In the bench suite run, as in 2b and 3-bench.toml: the truck by
# b-truck/flight-silence; bridge and witness by b-bridge/idf-log and
# b-witness/idf-log.
