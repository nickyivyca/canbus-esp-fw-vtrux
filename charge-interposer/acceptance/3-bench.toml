# Q2  The runner in bench.slice for the whole run, including the emulated
#     suite's builds above the local LLM, as the user ruled for the step 3
#     emulated run: does that ruling carry, or does this run follow the
#     settings' placement alone (lock and wall-clock checks in bench.slice,
#     builds in build.slice)?
