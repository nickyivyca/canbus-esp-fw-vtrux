# Q1  The product: f57ca9d3 + the slcan removal. b467's build records hold
#     each build's app and ELF sha256, not its code hash. Options:
#     (a) the tester's entry compares each new build's code hash (shared/tools
#         R3, vtrux_tools.py image) with f57ca9d3's same variant, rebuilt or
#         read from b467's archived files if they are kept, and says
#         whether the product the bench saw is the same code;
#     (b) none: the bench baseline is of 0691f6f1's product, compared with
#         b467 as the nearest bench record, the slcan removal named as the
#         one product change.
# (The emulated suite, about five hours with its m-sims, runs whole because
# the bench suite requires a whole run on the same code, by product digest:
