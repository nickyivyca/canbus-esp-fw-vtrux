# The acceptance runner's BUILD SMOKE LIST: a fixture of the adapter's
# build target, not an acceptance list (acceptance lists are the
# reviewer's, under acceptance/, ACCEPT-SPEC A2). A --dev run of it builds
# one variant of the 2a product through the adapter's "idf-build" target
# and "idf" shell (accept_adapter.py; the charge-interposer reviewer,
# 2026-11-04), in a tree of its own, and records its images, ELF and
# toolchain: the path the 2a list's six builds take. Its records go to
# interposer-firmware/dev-runs/, never runs/, and are never evidence.
# Local only (builds on remote trees are refused); an ESP-IDF build of
# about a quarter of an hour.

[step]
id = "build-smoke"
project = "charge-interposer"
ordered_by = "charge-interposer reviewer"
ordered_on = "2026-11-04"
spec = ["none: a smoke run of the acceptance runner's build target"]
verification = "none (a --dev smoke run is never evidence)"

# the final 2a product (the reviewer, 2026-11-03)
[trees.prod]
project = "cf1b911326d62fc7a7a743be2050ff51bf37f0d6"

[[build]]
id = "bridge"
tree = "prod"
target = "idf-build"
options = { variant = "bridge" }

[[set]]
id = "light"
tree = "prod"
select = ["id:paths-test"]

# Since 0fbcdec the pins name two tags (the reviewer's batch, 2026-11-04);
# since c5e07f2 shared/bench is at 2026.11.04.4, shared/tools and
# shared/twai_port at 2026.11.03 (the reviewer's batches, 2026-11-04). A tree
# at that commit gets a checkout of each beside it, and each component's pin
# check finds its own. The prod tree above has all three at 2026.11.03, so
# this list shows both layouts.
[trees.head]
project = "c5e07f2724c33c9dc703f315182bcf664d4f522b"

[[check]]
id = "pin-bench"
tree = "head"
run = ["charge-interposer/shared_pin.py", "check", "shared/bench"]

[[check]]
id = "pin-twai-port"
tree = "head"
run = ["charge-interposer/shared_pin.py", "check", "shared/twai_port"]

# The harness at d6de923: variant_diff with the app link compared, and
# no_led.py (2a acceptance (j), as the reviewer ruled it, (B)). Its product
# files are cf1b911's but for the shared/bench pin (product digest the same).
[trees.harness]
project = "d6de923ed0d3d28160178d36a01979e31b5bc089"

# the variant check on the build's own folder against itself: no switch
# differs, so it must refuse (the reviewer's "a pair with no difference");
# shows the build_<id> setting reaches a check, and the link read on a real
# build.ninja
[[check]]
id = "variant-diff-self-pair"
tree = "harness"
run = ["charge-interposer/fw_harness/variant_diff.py", "--pair", "{build_bridge}",
       "{build_bridge}", "--switches", "INTP_ORDER_WITNESS"]
expect = "FAIL"

# spec 8's no LED on the build, its can-fail on copies of it (with the
# control: rgbLedWrite present, rule 1 passing), and the mutant build:
# board_led called in a clone of the tree, built in the "idf" shell, must
# be caught (an ESP-IDF build of its own). Its clone goes in {clone}'s
# scratch/: inside this tree the build folder is too deep for ESP-IDF on
# Windows (build smoke 5, WinError 267)
[[check]]
id = "no-led-bridge"
tree = "harness"
run = ["charge-interposer/fw_harness/no_led.py", "--build", "{build_bridge}"]

[[check]]
id = "no-led-canfail"
tree = "harness"
run = ["charge-interposer/fw_harness/no_led.py", "--can-fail", "--build", "{build_bridge}"]

[[check]]
id = "no-led-mutant"
tree = "harness"
shell = "idf"
run = ["charge-interposer/fw_harness/no_led.py", "--mutant-build", "bridge",
       "--scratch-from", "{clone}"]
