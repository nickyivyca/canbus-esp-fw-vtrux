# The acceptance runner's SMOKE LIST: a fixture of the adapter's tests, not
# an acceptance list (acceptance lists are the reviewer's, under acceptance/,
# ACCEPT-SPEC A2). A --dev run of it proves the whole path end to end -- a
# local tree and a madhouse tree, their setup, a few light harness checks,
# a premise, the close and the cleanup -- with nothing wall-clock, no bench,
# no builds and no lock (the charge-interposer reviewer, 2026-11-02). Its
# records go to interposer-firmware/dev-runs/, never runs/, and are never
# evidence.
#
# Since 2026-11-02 it also proves host_bridge's TWAI_FAKE option on madhouse
# with real g++ (the reviewer's order of that day): host_bridge on our own
# fake and on the shared fake at 40c0bcc, the fake port step 1b's acceptance
# E ran on, compared with the masked-log comparer (E found the two
# transcripts identical), and the shared fake's can-fail (run.sh's own
# --can-fail mode). Both runs expect FAIL: host_bridge carries the two
# recorded KNOWN FAILs (bridge-ok-veh-failed, bridge-ok-switch-discard).
# expect = "FAIL" alone would also take a test that did not build (the judge's
# ERROR): the smoke run of 21bf42f, at 71351ff, had test_event_layout not
# built under TWAI_FAKE=shared, and only e-transcripts caught it (fixed in
# de11c44). Since b3e2395 run.sh works in its tree's scratch/, which on
# madhouse is inside the runner's tree there.
#
# Since 2026-11-08 (follow-up (B) after port step 2a, 73931df5) run.sh prints
# its test list and a closing line per test, and the host_bridge judge reads
# both. This list then runs every user of run.sh once on that commit: hb-own
# and hb-shared on madhouse, at the twai_port pin port step 2a ran on
# (2026.11.03), and the emulated suite's m-host/host-bridge on the local tree
# ("emu-hb"), for their per-result verdicts to be compared by hand with run
# accept_2a_20261107T170853_6976's.

[step]
id = "smoke"
project = "charge-interposer"
ordered_by = "charge-interposer reviewer"
ordered_on = "2026-11-02"
spec = ["none: a smoke run of the acceptance runner"]
verification = "none (a --dev smoke run is never evidence)"

[trees.local]
project = "73931df5582267f2a55a4a8ac0f044a68883f8df"

[trees.madhouse]
project = "73931df5582267f2a55a4a8ac0f044a68883f8df"
host = "madhouse"
shared = { twai_port = "2026.11.03" }

[[set]]
id = "harness"
tree = "local"
select = ["id:paths-test", "id:build-lookup-offline-test"]

[[set]]
id = "mad"
tree = "madhouse"
select = ["id:host-unit"]

[[check]]
id = "hb-own"
tree = "madhouse"
run = ["charge-interposer/fw_harness/host_bridge/run.sh"]
shell = "git-bash"
judge = "host-bridge"
cls = "build"
env = { L3_STIMULUS = "{madhouse_artifacts}/l3_stimulus.txt" }
expect = "FAIL"

[[check]]
id = "hb-shared"
tree = "madhouse"
run = ["charge-interposer/fw_harness/host_bridge/run.sh"]
shell = "git-bash"
judge = "host-bridge"
cls = "build"
env = { L3_STIMULUS = "{madhouse_artifacts}/l3_stimulus.txt", TWAI_FAKE = "shared" }
timeout_s = 14400
expect = "FAIL"
after = ["hb-own"]

[[compare]]
id = "e-transcripts"
comparer = "masked-log"
a = "hb-own"
b = "hb-shared"
expect = "identical"

[[canfail]]
id = "shared-fake"
target = "hb-shared"
mutants = { mode = "--can-fail" }
expect = "mode-passes"

# the emulated suite's own host_bridge run, judged by the same judge
[[suite_run]]
id = "emu-hb"
tree = "local"
suite = "emulated"
checks = ["m-host/host-bridge"]

# the trees' product digest the same as port step 2a's product: the commits
# since cf1b911 changed no product file
[[premise]]
id = "digest"
kind = "product_digest_same_as"
tree = "local"
commit = "cf1b911326d62fc7a7a743be2050ff51bf37f0d6"
