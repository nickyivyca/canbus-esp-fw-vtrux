## The interposer's dependencies, recorded in ../dependencies.lock.
dependencies:
  # The Arduino core as an ESP-IDF component (port plan goal 1), at the
  # version the PlatformIO baseline built with, 3.2.1. It stays only in this
  # project's own layers (goal 15); stage (b) reduces it away.
  espressif/arduino-esp32:
    version: "3.2.1"
  # Five of arduino-esp32's dependencies held at the versions the baseline's
  # prebuilt Arduino libraries were built with (their dependencies.lock), all
  # inside arduino-esp32's own ranges. Unheld, the Component Manager takes
  # the newest in range, so the build would differ from the baseline in code
  # the port did not choose to change (port stage (a), goal 14).
  espressif/esp_modem:
    version: "1.4.0"
  espressif/esp_secure_cert_mgr:
    version: "2.5.0"
  espressif/libsodium:
    version: "1.0.20~2"
  espressif/mdns:
    version: "1.8.2"
  joltwallet/littlefs:
    version: "1.20.0"
  # THE SHARED COMPONENTS, ALL FOUR AT ONE shared/main TAG (spec 2.4, port
  # step 2b; 2026.11.28 from the T19 app's switch through can_port_set_mode,
  # T14, T19, and the S3 file's S3_PROBE_BUILD guard; 2026.11.28.3, with no
  # built file changed, so the harness's twai_port pin can name the tag with
  # shared/twai_port probe_analysis/ and idf-match still holds): the
  # board, the CAN port interface, the vehicle port's driver and the restart
  # guard.
  # vtrux/twai_port is taken "with vtrux/can_port and its board at the same
  # shared/main tag" (its CMakeLists.txt), and restart_guard "with
  # vtrux/can_port, its CAN drivers and its board at the same tag" (its
  # idf_component.yml); each finds the board by its include/board_pins.h.
  # From git, never through override_path.
  #
  # The board (shared/boards SPEC B1 and B2): the one shared/boards/*
  # component. sdkconfig names its partition table by this dependency's
  # managed_components/ folder, vtrux__x2. shared/boards/x2 has no file
  # changed from 2026.11.08, its pin at port step 2b.
  vtrux/x2:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/boards/x2
    version: "2026.11.28.3"
  # The CAN port interface both ports present (can_port C1), with a backend
  # registered per port index.
  vtrux/can_port:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/can_port
    version: "2026.11.28.3"
  # The vehicle port (twai_port T1), the S3's TWAI controller on board port 0.
  # The s3probe variant's two switches (../CMakeLists.txt) add its T19 app.
  vtrux/twai_port:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/twai_port
    version: "2026.11.28.3"
  # Every software restart, a crash included, takes the CAN ports off the bus
  # first (restart_guard G1, G2: a link-time wrap, in every variant; the
  # reviewer, 2026-11-28, the start of stage (b) step 3). Until T19's
  # measurement passes, the S3's TWAI stop (twai_port T12) answers "not
  # supported" outside the s3probe build, the MCP2515 port has no stop yet
  # (can_port C7) and the X2 has no standby line, so the guard only writes
  # its record (G4) and restarts.
  vtrux/restart_guard:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/restart_guard
    version: "2026.11.28.3"
  # The diag frames' packer and build-id read (shared/diag D2-D4; spec 8.2,
  # schema 5, user 2026-11-23): 0x7F4-0x7F7 are packed from
  # intp_diag_table.c, generated from diag/vtrux-interposer-diag.dbc by this
  # tag's tools/diag_table_gen.py, with the fit checks (D6) in its header.
  # The tag shared_pins.json pins as "shared/diag"; at 2026.11.28.3, the
  # four above's tag, from 2026.11.23.5, with no build input changed
  # (vtrux_checks.json, README.md, VERIFICATION.md and test/ only, all by
  # 2026.11.27.5).
  vtrux/diag:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/diag
    version: "2026.11.28.3"
  # ESP-IDF v5.4.2 exactly (user, 2026-11-03): arduino-esp32 3.2.1 does not
  # compile on 5.4.1, gen-inhibit's IDF, and the baseline's prebuilt Arduino
  # libraries were built on 5.4.2. Exact, so a shell exported for the wrong
  # IDF stops at the dependency check, not partway through the compile.
  idf:
    version: "5.4.2"
