; Vtrux charge interposer -- Autosport Labs ESP32-CAN-X2
;
; There is no PlatformIO board definition for the ESP32-CAN-X2 (`pio boards`
; has nothing matching), so this builds against the generic S3 devkit and takes
; its pins from the Arduino variant `aslcanx2` in espressif/arduino-esp32. The
; vendor's own esp-idf example does exactly the same thing.
;
; Framework is arduino rather than espidf on purpose: the only board support
; that exists for this hardware is the Arduino variant, and the interposer's
; latency budget is mild -- store-and-forward against a 20 Hz command frame.
; (The sibling generator-inhibit project uses native ESP-IDF for reasons
; specific to the WiCAN: a stock partition table to preserve and no USB port.)
;
; PSRAM is deliberately left off. The N8R8 module has 8 MB of it, we need none,
; and enabling it costs SPI pins and adds cache-miss jitter.

[common]
; PINNED, and pinned to a URL rather than a version (spec 8.2, user
; 2026-10-08). `platform = espressif32` resolved to whatever was
; installed locally, which here is the pioarduino FORK at 54.03.21 --
; its platform.json gives the repository as
; github.com/pioarduino/platform-espressif32. On a machine without that
; installed, the bare name fetches MAINLINE espressif32 from the
; registry instead: a different platform, a different toolchain and so a
; different ELF, or no build at all. The registry has no 54.x of the
; mainline platform, so `espressif32@54.03.21` would not resolve either.
; This is the exact release asset ~/.platformio/platforms/espressif32/
; .piopm records as the install source, so it is immutable and resolves
; the same way on any machine.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
; Every environment's image gets a distinct, self-describing name
; (interposer_<srcdigest>_<tag>.bin) instead of firmware.bin. See the
; header of build_name.py for why, and why there is no git sha in it.
extra_scripts =
; Fixes SOURCE_DATE_EPOCH and the build paths recorded in the ELF, so the
; same sources give the same image in any folder on any machine (8.2).
; FIRST, because it must set the environment before anything compiles.
    pre:reproducible.py
    pre:build_name.py
; Records every built image in builds/manifest.json, so the 4 bytes
; the board reports in 0x7F7 can be mapped back to an image.
    post:manifest.py
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
; Route Arduino's `Serial` to the S3's USB-Serial/JTAG peripheral -- i.e. the
; same USB cable used to flash. The esp32-s3-devkitc-1 board definition sets
; ARDUINO_USB_MODE=1 but leaves ARDUINO_USB_CDC_ON_BOOT at 0, which makes
; `Serial` UART0 on GPIO43/44 instead: pins with nothing attached on this board.
; Symptom is silence that looks exactly like a crash -- the ROM bootloader
; banner appears (the ROM writes to USB directly) and then nothing, with no
; panic and no reboot loop. Found on the first Stage 0 run, 2026-09-10.
    -DARDUINO_USB_CDC_ON_BOOT=1
; No external CAN library. The MCP2515 driver is in src/port_mcp2515.cpp --
; see the comment at the top of that file for why coryjfowler/MCP_CAN_lib is
; not used despite being the obvious choice.
lib_deps =

; The bridge. BENCH build -- serial enabled. For the truck use [env:truck].
;
; Every env here must exclude every OTHER env's main, or the link fails with
; "multiple definition of setup()". Adding a new *_main.cpp means adding it to
; the exclusion list of every existing env; on 2026-09-29 `slcan_main.cpp` was
; added without that, and this env -- the one that goes in the truck -- did not
; link at all until 2026-10-03. Nothing caught it because nobody built it in
; between.
[env:esp32-can-x2]
extends = common
build_src_filter = +<*> -<selftest_main.cpp> -<diag_main.cpp> -<slcan_main.cpp>

; Stage 0 board self-test. Needs CAN1H<->CAN2H and CAN1L<->CAN2L jumpers, and
; NOTHING else connected -- see the header of src/selftest_main.cpp.
;
; Never flash the bridge env with those jumpers fitted: it would forward
; CAN1 -> CAN2 straight back onto its own wire and storm.
[env:selftest]
extends = common
build_src_filter = +<*> -<main.cpp> -<machine.cpp> -<diag_main.cpp> -<slcan_main.cpp>

; Stage 0a controller diagnostic. Internal loopback in each controller, so it
; needs no jumpers and does not care whether they are fitted. Flash this when a
; Stage 0 cross-port failure needs separating from a wiring fault.
[env:diag]
extends = common
build_src_filter = +<*> -<main.cpp> -<machine.cpp> -<selftest_main.cpp> -<slcan_main.cpp>

; BENCH ONLY -- a plain SLCAN transmitter on CAN1, for the generator-inhibit
; bench. It needs a second transmitter on the powertrain segment because frames
; queued in ONE adapter do not arbitrate against each other, so filler from the
; PCAN delays the replay's 0x051 no matter what its CAN priority is; from a
; separate controller, arbitration places it correctly. See the header of
; src/slcan_main.cpp for the full reasoning and the protocol subset.
;
; FLASHING THIS REPLACES THE BRIDGE. Restore with `-e esp32-can-x2`; a byte-exact
; image of the flash as it was beforehand is kept in
; projects/vtrux/notes/artifacts/interposer-firmware/flash-backup/ in the
; reverse-it project (not in this repo; the backup images stay in SeaDrive).
;
; The MCP2515 is excluded: this env never touches the charger segment.
[env:slcan]
extends = common
build_src_filter = +<*> -<main.cpp> -<machine.cpp> -<selftest_main.cpp> -<diag_main.cpp> -<port_mcp2515.cpp>

; BENCH ONLY -- the bridge plus the completion-order witness.
;
; Identical to [env:esp32-can-x2] and adds exactly one flag. It keeps serial,
; because dumping the witness is the entire point, and it must therefore never
; gain -DINTP_NO_SERIAL.
;
; This is the ONLY environment allowed to define a diagnostic gate.
; test/build_check.py whitelists it BY EXACT NAME, asserts it is not the truck
; environment and not a no-serial build, and still rejects INTP_ORDER_WITNESS
; or INTP_TX_TRACE appearing in any other environment. Renaming this env
; without updating that list makes build_check fail rather than quietly
; allowing the macro somewhere new.
;
; The image announces itself: the boot banner and every dump header carry
; WITNESS BUILD, so a board left in this state cannot be mistaken for the
; bench bridge.
[env:esp32-can-x2-witness]
extends = common
build_src_filter = +<*> -<selftest_main.cpp> -<diag_main.cpp> -<slcan_main.cpp>
build_flags =
    ${common.build_flags}
    -DINTP_ORDER_WITNESS=1

; THE TRUCK BUILD (spec 8.3). Identical to [env:esp32-can-x2] except that all
; serial output is compiled out.
;
; Why: every Serial.printf in main.cpp runs inside the bridge loop. A USB host
; that is attached but not reading can block the CDC write, and the bridge
; would stall with it -- not measured, but the board has no business being able
; to stall that way in a vehicle. INTP_NO_SERIAL removes the calls at compile
; time rather than guarding them at run time, so there is nothing left to
; block on and no code path that depends on a host being absent.
;
; The diagnostic CAN frames of spec 8.2 are unaffected: 0x7F4-0x7F7 are how the
; truck build is observed.
[env:truck]
extends = common
build_src_filter = +<*> -<selftest_main.cpp> -<diag_main.cpp> -<slcan_main.cpp>
build_flags =
    ${common.build_flags}
    -DINTP_NO_SERIAL=1
