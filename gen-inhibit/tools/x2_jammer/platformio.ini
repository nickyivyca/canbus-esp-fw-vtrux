; Vtrux X2 JAMMER -- test equipment, NOT FOR VEHICLE.
;
; Gen-inhibit tester, 2026-10-08. Puts short dominant pulses on CAN1 of an
; Autosport Labs ESP32-CAN-X2 by driving the transceiver TXD (GPIO7) from the
; RMT peripheral. It never sends a CAN frame. See README.md for the command
; protocol, the safety design and the bench procedure.
;
; Toolchain and board settings are the same as the charge interposer's
; (charge-interposer/firmware/platformio.ini on charge-interposer/main): its
; pinned pioarduino espressif32 54.03.21-2 (pinned here too since 2026-10-24;
; a bare "espressif32" fetched whatever the registry had on a fresh machine),
; generic S3 devkit, USB-Serial-JTAG as Serial. Build from
; PowerShell:  py -3.14 -m platformio run -d <this folder>
;
; build_dir is outside SeaDrive so object files do not sync; the post script
; copies each image into builds/ and appends it to builds/manifest.json, keyed
; by the image's own md5 (a filename does not identify an image).

[platformio]
build_dir = ${sysenv.LOCALAPPDATA}/pio_build/vtrux_x2_jammer

[env:vtrux_jammer_x2_NOT_FOR_VEHICLE]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 8MB
monitor_speed = 115200
extra_scripts =
    pre:jammer_name.py
    post:jammer_archive.py
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
