## IDF Component Manager Manifest File
dependencies:
  # The stock WiCAN code (shared/wican W1, spec 3.3) and its debug log, at the
  # shared/main tag this project pins, from git, as the board is. mDNS comes
  # with vtrux/wican now, which needs it.
  vtrux/wican:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/wican
    version: "2026.10.31"
  vtrux/debug_logs:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/debug_logs
    version: "2026.10.31"
  # Port 0 (spec 3.3, port step 1b): the CAN port interface, whose stock calls
  # vtrux/wican's files make, and the TWAI port behind it, at the same tag.
  vtrux/can_port:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/can_port
    version: "2026.10.31"
  vtrux/twai_port:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/twai_port
    version: "2026.10.31"
  # The board (shared/boards SPEC B1 and B2): the one shared/boards/*
  # component, at the shared/main tag this project pins, from git, never
  # through override_path. sdkconfig names its partition table by this
  # dependency's managed_components/ folder, vtrux__wican_v3.
  vtrux/wican_v3:
    git: https://github.com/nickyivyca/canbus-esp-fw-vtrux.git
    path: shared/boards/wican_v3
    version: "2026.10.31"
  ## Required IDF version
  idf:
    version: ">=4.1.0"
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
